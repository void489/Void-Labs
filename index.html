<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Void Labs</title>
<meta name="description" content="Void Labs: Donut and Pixel.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23100d1c'/><circle cx='50' cy='50' r='16' fill='%23f4efff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0e0b18;
  --deep:#171230;
  --ink:#f4efff;
  --muted:#9d94bd;
  --frosting:#ff8fb8;
  --cyan:#62e6ff;
  --line:#2a2350;
}
*{box-sizing:border-box;margin:0}
html{background:var(--void)}
body{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(60vmax 60vmax at 85% -10%, #2a1d63 0%, transparent 60%),
    var(--void);
  min-height:100vh;
  display:flex;flex-direction:column;
  line-height:1.5;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:4px}

header{padding:clamp(1.5rem,4vw,3rem) clamp(1.25rem,6vw,5rem) 0}
.mark{display:inline-flex;align-items:center;gap:.7rem;font-weight:600;font-size:1.05rem}
.mark i{
  width:1.6rem;height:1.6rem;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, var(--void) 0 32%, var(--ink) 34% 100%);
  animation:breathe 5s ease-in-out infinite;
}
@keyframes breathe{50%{transform:scale(1.12)}}

main{flex:1;padding:clamp(3rem,10vw,8rem) clamp(1.25rem,6vw,5rem) 3rem}
h1{
  font-weight:800;
  font-size:clamp(3rem,10vw,8.5rem);
  line-height:.95;letter-spacing:-.04em;
  max-width:11ch;
}
.lede{margin-top:1.5rem;color:var(--muted);font-size:1.15rem;max-width:34ch}

.sites{margin-top:clamp(3rem,8vw,6rem);border-top:1px solid var(--line)}
.site{
  display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;gap:clamp(1rem,3vw,2.5rem);
  padding:clamp(1.25rem,3vw,2.25rem) 0;
  border-bottom:1px solid var(--line);
  position:relative;
  transition:padding .25s ease;
}
.site:hover,.site:focus-visible{padding-left:1rem;padding-right:1rem}
.site::before{
  content:"";position:absolute;inset:0;z-index:-1;border-radius:14px;
  background:var(--c);opacity:0;transition:opacity .25s ease;
}
.site:hover::before,.site:focus-visible::before{opacity:.1}

.badge{width:4.5rem;height:4.5rem;flex:none}
.donut{
  border-radius:50%;
  background:radial-gradient(circle, var(--void) 0 22%, var(--frosting) 24% 100%);
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.12);
}
.pixel{
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
}
.pixel b{background:var(--cyan);opacity:.18}
.pixel b.on{opacity:1}

.name{font-weight:800;font-size:clamp(1.8rem,4.5vw,3.2rem);letter-spacing:-.03em;line-height:1.05}
.desc{color:var(--muted);margin-top:.35rem}
.host{font-weight:600;color:var(--c);font-size:1.05rem;text-align:right}

footer{padding:2rem clamp(1.25rem,6vw,5rem);color:var(--muted);font-size:.9rem}

@media (max-width:640px){
  .site{grid-template-columns:auto 1fr}
  .host{grid-column:1 / -1;text-align:left}
  .badge{width:3.5rem;height:3.5rem}
}
@media (prefers-reduced-motion:reduce){
  .mark i{animation:none}
  .site,.site::before{transition:none}
}
</style>
</head>
<body>
<header>
  <a class="mark" href="/"><i aria-hidden="true"></i>Void Labs</a>
</header>

<main>
  <h1>Things built in the void.</h1>
  <p class="lede">Two projects, one home. Pick where you want to go.</p>

  <nav class="sites" aria-label="Void Labs sites">
    <a class="site" href="https://donut.voidlabs.fun" style="--c:var(--frosting)">
      <div class="badge donut" aria-hidden="true"></div>
      <div>
        <div class="name">Donut</div>
        <p class="desc">Dashboard and Discord bot for the Donut network.</p>
      </div>
      <span class="host">donut.voidlabs.fun</span>
    </a>

    <a class="site" href="https://pixel.voidlabs.fun" style="--c:var(--cyan)">
      <div class="badge pixel" aria-hidden="true">
        <b></b><b class="on"></b><b></b><b class="on"></b>
        <b class="on"></b><b></b><b class="on"></b><b></b>
        <b></b><b class="on"></b><b></b><b class="on"></b>
        <b class="on"></b><b></b><b class="on"></b><b></b>
      </div>
      <div>
        <div class="name">Pixel</div>
        <p class="desc">Discord bot for tickets, giveaways, moderation and staff tools, with a web dashboard.</p>
      </div>
      <span class="host">pixel.voidlabs.fun</span>
    </a>
  </nav>
</main>

<footer>&copy; <span id="y">2026</span> Void Labs</footer>
<script>document.getElementById("y").textContent=new Date().getFullYear()</script>
</body>
</html>
